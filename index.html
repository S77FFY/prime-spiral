    famBtn.disabled = mode === 'grid';
    selBtn.classList.toggle('on', selStep > 0);
    selBtn.textContent = selStep > 0 ? 'done' : 'select line';
    selUndoBtn.style.display = selStep > 0 && selMarks.length ? 'inline-block' : 'none';
    sideEl.style.display = (selCurve && mode !== 'grid' && state !== 'idle') ? 'flex' : 'none';
    revBtn.textContent = 'revolve: ' + (revolve ? 'on' : 'off');
    revBtn.classList.toggle('off', !revolve);
  }

  function fitView() { sv = s; wcx = wcy = 0; }

  function start() {
    rhX = []; rhE = [];
    target = calibrate();
    goal = Math.min(target, NMAX);
    spin = 0; setView();
    selStep = 0; selMarks = []; selCands = [];
    reset();
    state = 'run';
    hudEl.style.display = 'block';
    setBars(); drawUI();
    t0 = lastT = performance.now();
    requestAnimationFrame(frame);
  }

  function togglePause() {
    if (state === 'run') { state = 'paused'; pausedAt = performance.now(); setBars(); drawUI(); }
    else if (state === 'paused') {
      const now = performance.now();
      t0 += now - pausedAt; lastT = now;
      if (isZoomed()) { fitView(); lineDirty = true; }
      selStep = 0; selMarks = []; selCands = [];
      state = 'run'; setBars(); drawUI();
      requestAnimationFrame(frame);
    }
  }

  function finish() {
    state = 'done';
    feedAll(); rhSample();
    updateLine(); render(); hud(DURATION); updateSide(); rhDraw();
    setBars(); drawUI();
  }

  function goIdle() {
    state = 'idle'; spin = 0;
    clearTimeout(settleTimer); famJob++;
    selStep = 0; selMarks = []; selCands = [];
    hudEl.style.display = 'none';
    setView(); reset();
    setBars(); drawUI();
  }

  function save() {
    const cv = document.createElement('canvas'); cv.width = VW; cv.height = VH;
    const x = cv.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, VW, VH);
    if (showLine) x.drawImage(lineC, 0, 0);
    x.globalCompositeOperation = 'lighter';
    if ('filter' in x) { x.filter = 'blur(' + (3 * k) + 'px)'; x.drawImage(primeC, 0, 0); x.filter = 'none'; }
    x.drawImage(primeC, 0, 0);
    x.globalCompositeOperation = 'source-over';
    x.fillStyle = 'rgba(57,255,20,.85)';
    x.font = Math.round(12 * k) + 'px ui-monospace,Menlo,Consolas,monospace';
    x.textAlign = 'left';
    x.fillText(fmt(count) + ' primes below ' + fmt(N), 12 * k, 22 * k);
    x.fillStyle = 'rgba(57,255,20,.5)';
    x.font = Math.round(10 * k) + 'px ui-monospace,Menlo,Consolas,monospace';
    x.fillText(CREDIT, 12 * k, VH - 12 * k);
    x.textAlign = 'right'; x.fillText('v' + VERSION, VW - 12 * k, VH - 12 * k);
    cv.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'prime-spiral-' + mode + '-' + count + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, 'image/png');
  }

  // ---- zoom view control ----
  // screen (CSS px) -> drawing-canvas pixel, undoing the canvas position and any revolve rotation
  function toCanvas(px, py) {
    const ox = (c - vox) / k, oy = (c - voy) / k;
    let qx = px - (cssL + ox), qy = py - (cssT + oy);
    if (revolving()) { const a = -spin * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a); const rx = qx * ca - qy * sa; qy = qx * sa + qy * ca; qx = rx; }
    return [(ox + qx) * k, (oy + qy) * k];
  }
  function fromCanvas(x, y) {
    const ox = (c - vox) / k, oy = (c - voy) / k;
    let qx = x / k - ox, qy = y / k - oy;
    if (revolving()) { const a = spin * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a); const rx = qx * ca - qy * sa; qy = qx * sa + qy * ca; qx = rx; }
    return [cssL + ox + qx, cssT + oy + qy];
  }
  function dirToCanvas(dx, dy) {
    if (revolving()) { const a = -spin * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a); const rx = dx * ca - dy * sa; dy = dx * sa + dy * ca; dx = rx; }
    return [dx * k, dy * k];
  }
  function svMax() { return s0 * 2; }
  function clampView() {
    if (sv <= s * 1.001) { sv = s; wcx = wcy = 0; return; }
    const ext = mode === 'sacks' ? Math.sqrt(N) : Math.sqrt(Math.max(1, N - 40)) / 2 + 1;
    wcx = Math.max(-ext, Math.min(ext, wcx)); wcy = Math.max(-ext, Math.min(ext, wcy));
  }
  function zoomAt(cx, cy, f) {
    const cx0 = c - vox, cy0 = c - voy;
    const wx = (cx - cx0) / sv + wcx, wy = (cy - cy0) / sv + wcy;
    sv = Math.max(s, Math.min(svMax(), sv * f));
    wcx = wx - (cx - cx0) / sv; wcy = wy - (cy - cy0) / sv;
    clampView();
  }
  function panBy(dxC, dyC) { if (sv <= s * 1.001) return; wcx -= dxC / sv; wcy -= dyC / sv; clampView(); }

  let previewPending = false, settleTimer = 0;
  function requestRender() {
    if (!previewPending) { previewPending = true; requestAnimationFrame(() => { previewPending = false; renderView(true); }); }
    clearTimeout(settleTimer);
    const settle = () => { if (pts.size > 0) { settleTimer = setTimeout(settle, 120); return; } renderView(false); };
    settleTimer = setTimeout(settle, 160);
  }

  // ---- pointer input: tap = start/pause/resume; drag, pinch and wheel zoom while paused/done ----
  const pts = new Map();
  let gest = null;
  uiC.addEventListener('pointerdown', e => {
    try { uiC.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) gest = { type: 'tap', x0: e.clientX, y0: e.clientY, t: performance.now(), lx: e.clientX, ly: e.clientY };
    else if (pts.size === 2 && canZoom()) {
      const [a, b] = [...pts.values()];
      gest = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    }
  });
  uiC.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !gest) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gest.type === 'tap' && Math.hypot(e.clientX - gest.x0, e.clientY - gest.y0) > 8) {
      if (canZoom()) gest.type = 'pan'; else gest.type = 'none';
    }
    if (gest.type === 'pan') {
      const [dx, dy] = dirToCanvas(e.clientX - gest.lx, e.clientY - gest.ly);
      gest.lx = e.clientX; gest.ly = e.clientY;
      panBy(dx, dy); requestRender();
    } else if (gest.type === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const [dx, dy] = dirToCanvas(mx - gest.mx, my - gest.my);
      panBy(dx, dy);
      const [cx, cy] = toCanvas(mx, my);
      if (gest.d > 0) zoomAt(cx, cy, d / gest.d);
      gest.d = d; gest.mx = mx; gest.my = my;
      requestRender();
    }
  });
  function endPointer(e) {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (!gest) return;
    if (gest.type === 'tap' && pts.size === 0 && performance.now() - gest.t < 500) {
      if (selStep > 0 && canZoom()) selectTap(gest.x0, gest.y0);
      else if (state === 'idle') start(); else if (state === 'run' || state === 'paused') togglePause();
    }
    if (gest.type === 'pinch' && pts.size === 1) { const [a] = [...pts.values()]; gest = { type: 'pan', lx: a.x, ly: a.y }; return; }
    if (pts.size === 0) gest = null;
  }
  uiC.addEventListener('pointerup', endPointer);
  uiC.addEventListener('pointercancel', endPointer);
  uiC.addEventListener('wheel', e => {
    e.preventDefault();
    if (!canZoom()) return;
    const [cx, cy] = toCanvas(e.clientX, e.clientY);
    zoomAt(cx, cy, Math.exp(-e.deltaY * 0.0015));
    requestRender();
  }, { passive: false });

  document.getElementById('zin').addEventListener('click', () => { const [x, y] = toCanvas(cw / 2, ch / 2); zoomAt(x, y, 2); requestRender(); });
  document.getElementById('zout').addEventListener('click', () => { const [x, y] = toCanvas(cw / 2, ch / 2); zoomAt(x, y, 0.5); requestRender(); });
  document.getElementById('zfit').addEventListener('click', () => { fitView(); renderView(false); });
  selBtn.addEventListener('click', () => {
    if (selStep > 0) { selStep = 0; if (!selCurve) { selMarks = []; selCands = []; } }   // done: keep the rings of a found line
    else { selStep = 1; selMarks = []; selCands = []; }
    setBars(); drawUI();
  });
  selUndoBtn.addEventListener('click', () => { selMarks.pop(); selCands.pop(); if (selCands.length < 2) { sel = null; selCurve = null; selPicks = []; selL.fill(0); sideEl.style.display = 'none'; renderView(false); } refitSelection(); });
  knBtn.addEventListener('click', () => {
    knownMode = knownMode === 'mark' ? 'hide' : knownMode === 'hide' ? 'off' : 'mark';
    knBtn.textContent = 'known: ' + knownMode;
    knBtn.classList.toggle('off', knownMode === 'off');
    if (state !== 'idle') renderView(false);
  });
  document.getElementById('selRun').addEventListener('click', () => { fitView(); start(); });
  selSaveBtn.addEventListener('click', () => {
    if (!selCurve) return;
    const i = mineIndex(selCurve);
    if (i >= 0) myLines.splice(i, 1);
    else myLines.push({ a: selCurve.a, b: selCurve.b, c: selCurve.c, rich: selExp > 0 ? +(selPrimes / selExp).toFixed(1) : 0 });
    saveMine(); rebuildMine(); updateSide();
  });
  famBtn.addEventListener('click', () => {
    famMode = famMode === 'hide' ? 'mark' : famMode === 'mark' ? 'off' : 'hide';
    famBtn.textContent = 'families: ' + famMode;
    famBtn.classList.toggle('off', famMode === 'off');
    if (state !== 'idle') renderView(false);
  });
  selFamBtn.addEventListener('click', () => { if (selCurve) addFamily(selCurve.a, selCurve.b, 'pm', 9999); });
  const fkSel = document.getElementById('fk'), fmxIn = document.getElementById('fmx'), fmxLab = document.getElementById('fmxl');
  fkSel.addEventListener('change', () => {
    const ex = fkSel.value === 'exact';
    fmxLab.textContent = ex ? 'c' : 'max';
    if (ex && fmxIn.value === '9999') fmxIn.value = '397';
    if (!ex && fmxIn.value === '397') fmxIn.value = '9999';
  });
  document.getElementById('fadd').addEventListener('click', () => addFamily(+document.getElementById('fa').value, +document.getElementById('fb').value, document.getElementById('fs').value, +fmxIn.value, fkSel.value));
  mineBtn.addEventListener('click', () => { mineEl.style.display = mineEl.style.display === 'flex' ? 'none' : 'flex'; renderMineList(); });
  document.getElementById('selClear').addEventListener('click', clearSelection);
  hudEl.addEventListener('click', () => { hudMini = !hudMini; hudEl.classList.toggle('mini', hudMini); hud(lastEl); });

  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') togglePause(); });
  for (const b of document.querySelectorAll('#modes button')) b.addEventListener('click', () => {
    rh = b.dataset.mode === 'riemann';
    mode = rh ? 'sacks' : b.dataset.mode;
    goIdle();
  });
  for (const t of rhEl.querySelectorAll('.rht')) t.addEventListener('click', () => { rhTab = t.dataset.tab; rhMinimised = false; rhTabs(); });
  document.getElementById('rhMin').addEventListener('click', () => { rhMinimised = !rhMinimised; rhTabs(); });
  document.getElementById('rhFitBand').addEventListener('click', () => { rhFit = 'band'; document.getElementById('rhFitBand').classList.add('on'); document.getElementById('rhFitCurve').classList.remove('on'); rhDraw(); });
  document.getElementById('rhFitCurve').addEventListener('click', () => { rhFit = 'curve'; document.getElementById('rhFitCurve').classList.add('on'); document.getElementById('rhFitBand').classList.remove('on'); rhDraw(); });
  const rhK = document.getElementById('rhK'), rhKv = document.getElementById('rhKv');
  rhK.addEventListener('input', () => { rhKv.textContent = rhK.value; rhDraw(); });
  document.getElementById('rhPlay').addEventListener('click', () => {
    const id = ++rhPlayT; rhK.value = 0;
    const tick = () => { if (id !== rhPlayT) return; rhK.value = Math.min(100, +rhK.value + 1); rhKv.textContent = rhK.value; rhDraw(); if (+rhK.value < 100) setTimeout(tick, 70); };
    tick();
  });
  twBtn.addEventListener('click', () => {
    showTwins = !showTwins;
    twBtn.textContent = 'twins: ' + (showTwins ? 'on' : 'off');
    twBtn.classList.toggle('off', !showTwins);
    if (state !== 'idle') renderView(false);
  });
  prBtn.addEventListener('click', () => {
    showPrimes = !showPrimes;
    prBtn.textContent = 'primes: ' + (showPrimes ? 'on' : 'off');
    prBtn.classList.toggle('off', !showPrimes);
    primeC.style.filter = showPrimes ? '' : 'drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px rgba(255,255,255,.45))';
    if (state !== 'idle') renderView(false);
  });
  lnBtn.addEventListener('click', () => {
    showLine = !showLine;
    lnBtn.textContent = 'line: ' + (showLine ? 'on' : 'off');
    lnBtn.classList.toggle('off', !showLine);
    lineC.style.visibility = showLine ? 'visible' : 'hidden';
  });
  const revTick = document.getElementById('revTick'), revChk = document.getElementById('revChk'), optsEl = document.getElementById('opts');
  document.getElementById('menuBtn').addEventListener('click', goIdle);
  revChk.addEventListener('change', () => {
    revolve = revChk.checked;
    spin = 0;
    setView(); setBars(); drawUI();
  });
  revBtn.addEventListener('click', () => {
    revolve = !revolve;
    if (!revolve) spin = 0;
    setView(); setBars();
    if (state !== 'idle') renderView(false);
  });
  document.getElementById('again').addEventListener('click', start);
  document.getElementById('save').addEventListener('click', save);
  addEventListener('resize', () => { if (state === 'idle') { setup(); reset(); drawUI(); } else relayout(); });

  target = goal = 0;
  renderMineList(); renderFamList(); rhTabs();
  setup(); reset(); setBars(); drawUI();
})();
</script>
<script data-goatcounter="https://s77ffy.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
